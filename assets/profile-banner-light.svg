<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Omnish — Full-Stack JavaScript Developer</title>
  <desc id="desc">A spacious, minimal light banner with deep navy typography, teal and violet accents, and an unboxed code sample.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="58%" stop-color="#F0F7FC"/>
      <stop offset="100%" stop-color="#E7F7F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="45%" r="63%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#64748B" stroke-opacity=".075"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="330" rx="20" fill="url(#glow)"/>
  <circle cx="1040" cy="62" r="100" fill="#67E8F9" opacity=".15" filter="url(#blur)"/>
  <circle cx="1000" cy="292" r="105" fill="#A78BFA" opacity=".13" filter="url(#blur)"/>
  <path d="M910 0H1000L1200 178V236L1142 273L884 0Z" fill="#0E7490" opacity=".08"/>
  <path d="M1200 68V117L1002 310L969 286Z" fill="#7C3AED" opacity=".11"/>
  <path d="M0 282L136 330H0Z" fill="#0891B2" opacity=".09"/>
  <g fill="none" stroke="#0E7490" stroke-opacity=".42" stroke-width="1.3">
    <path d="M788 65H845V44H897"/>
    <path d="M1038 73H1091V101H1142"/>
    <path d="M1047 246H1090V222H1152"/>
    <path d="M810 266H866"/>
  </g>
  <g fill="#0E7490">
    <circle cx="897" cy="44" r="3"/>
    <circle cx="1142" cy="101" r="3"/>
    <circle cx="1152" cy="222" r="3"/>
  </g>
  <text x="62" y="112" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="66" font-weight="800" letter-spacing="1.2" fill="#0F172A">OMNISH</text>
  <rect x="64" y="133" width="84" height="4" rx="2" fill="url(#accent)"/>
  <text x="62" y="172" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" font-weight="650" fill="#1E293B">React · Node.js · Express · MongoDB</text>
  <text x="62" y="207" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15.5" fill="#475569">Thoughtful interfaces. Reliable systems. Software built to last.</text>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="750" letter-spacing="2.1" fill="#0E7490">
    <text x="64" y="270">DESIGN</text>
    <text x="132" y="270" fill="#94A3B8">/</text>
    <text x="151" y="270">ENGINEER</text>
    <text x="238" y="270" fill="#94A3B8">/</text>
    <text x="257" y="270">IMPROVE</text>
  </g>
  <path d="M742 83V246" stroke="url(#accent)" stroke-width="1.4" stroke-opacity=".8"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16.5">
    <text x="775" y="112" fill="#0E7490">const</text>
    <text x="829" y="112" fill="#0F172A">developer = {</text>
    <text x="800" y="145" fill="#6D28D9">build:</text>
    <text x="860" y="145" fill="#92400E">"thoughtfully",</text>
    <text x="800" y="176" fill="#6D28D9">test:</text>
    <text x="849" y="176" fill="#92400E">"reliably",</text>
    <text x="800" y="207" fill="#6D28D9">improve:</text>
    <text x="875" y="207" fill="#92400E">"continuously"</text>
    <text x="775" y="240" fill="#0F172A">};</text>
  </g>
  <path d="M775 258H906" stroke="url(#accent)" stroke-width="1.5" stroke-opacity=".7"/>
