<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Omnish — Full-Stack JavaScript Developer</title>
  <desc id="desc">A dark blue and teal gradient developer banner with abstract code-inspired geometry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="48%" stop-color="#10253D"/>
      <stop offset="100%" stop-color="#0C4A5E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94A3B8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="330" rx="24" fill="url(#glow)"/>
  <circle cx="990" cy="120" r="76" fill="#22D3EE" opacity="0.10" filter="url(#softGlow)"/>
  <circle cx="1080" cy="250" r="90" fill="#A78BFA" opacity="0.12" filter="url(#softGlow)"/>
  <path d="M780 0 L1035 0 L1200 142 L1200 198 L1010 330 L840 330 L1045 160 Z" fill="#0B1220" opacity="0.28"/>
  <path d="M860 0 L925 0 L1130 170 L1090 205 Z" fill="url(#accent)" opacity="0.26"/>
  <path d="M1200 45 L1200 92 L970 290 L930 260 Z" fill="#67E8F9" opacity="0.14"/>
  <g stroke="#67E8F9" stroke-width="1.5" stroke-opacity="0.55" fill="none">
    <path d="M795 88 h62 v-26 h44"/><circle cx="901" cy="62" r="4" fill="#67E8F9" stroke="none"/>
    <path d="M825 132 h35 v28 h56"/><circle cx="916" cy="160" r="4" fill="#67E8F9" stroke="none"/>
    <path d="M978 74 h47 v31 h50"/><circle cx="1075" cy="105" r="4" fill="#67E8F9" stroke="none"/>
    <path d="M1000 222 h58 v-26 h52"/><circle cx="1110" cy="196" r="4" fill="#67E8F9" stroke="none"/>
  </g>
  <rect x="804" y="118" width="270" height="100" rx="15" fill="#0B1220" fill-opacity="0.45" stroke="#94A3B8" stroke-opacity="0.30"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#CBD5E1">
    <text x="828" y="151"><tspan fill="#67E8F9">const</tspan><tspan dx="8">developer = {</tspan></text>
    <text x="846" y="179"><tspan fill="#A78BFA">build</tspan><tspan>: </tspan><tspan fill="#FDE68A">"thoughtfully"</tspan></text>
    <text x="846" y="203"><tspan fill="#A78BFA">ship</tspan><tspan>: </tspan><tspan fill="#FDE68A">"reliably"</tspan><tspan> };</tspan></text>
  </g>
  <rect x="64" y="48" width="250" height="30" rx="15" fill="#0F766E" fill-opacity="0.26" stroke="#67E8F9" stroke-opacity="0.50"/>
  <circle cx="83" cy="63" r="4" fill="#67E8F9"/>
  <text x="98" y="68" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#A5F3FC">FULL-STACK JAVASCRIPT</text>
  <text x="60" y="155" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="800" letter-spacing="1.5" fill="#F8FAFC">OMNISH</text>
  <rect x="64" y="177" width="78" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="64" y="218" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#E2E8F0">React · Node.js · Express · MongoDB</text>
  <text x="64" y="252" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#AFC3D8">Building useful software with clarity, care, and engineering discipline.</text>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#BAE6FD">
    <text x="65" y="294">BUILD</text><text x="131" y="294" fill="#64748B">/</text><text x="149" y="294">TEST</text><text x="204" y="294" fill="#64748B">/</text><text x="222" y="294">IMPROVE</text>
  </g>
</svg>