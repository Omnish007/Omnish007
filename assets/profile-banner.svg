<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Omnish — Full-Stack JavaScript Developer</title>
  <desc id="desc">A spacious, minimal navy banner with cyan and violet accents and an unboxed code sample.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080F1F"/>
      <stop offset="56%" stop-color="#0D2038"/>
      <stop offset="100%" stop-color="#0B3948"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="45%" r="63%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#94A3B8" stroke-opacity=".055"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="330" rx="20" fill="url(#glow)"/>
  <circle cx="1040" cy="62" r="100" fill="#22D3EE" opacity=".12" filter="url(#blur)"/>
  <circle cx="1000" cy="292" r="105" fill="#8B5CF6" opacity=".13" filter="url(#blur)"/>
  <path d="M910 0H1000L1200 178V236L1142 273L884 0Z" fill="#38BDF8" opacity=".10"/>
  <path d="M1200 68V117L1002 310L969 286Z" fill="#A78BFA" opacity=".13"/>
  <path d="M0 282L136 330H0Z" fill="#0891B2" opacity=".13"/>
  <g fill="none" stroke="#67E8F9" stroke-opacity=".42" stroke-width="1.3">
    <path d="M788 65H845V44H897"/>
    <path d="M1038 73H1091V101H1142"/>
    <path d="M1047 246H1090V222H1152"/>
    <path d="M810 266H866"/>
  </g>
  <g fill="#67E8F9">
    <circle cx="897" cy="44" r="3"/>
    <circle cx="1142" cy="101" r="3"/>
    <circle cx="1152" cy="222" r="3"/>
  </g>
  <text x="62" y="112" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="66" font-weight="800" letter-spacing="1.2" fill="#F8FAFC">OMNISH</text>
  <rect x="64" y="133" width="84" height="4" rx="2" fill="url(#accent)"/>
  <text x="62" y="172" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" font-weight="650" fill="#E2E8F0">React · Node.js · Express · MongoDB</text>
  <text x="62" y="207" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15.5" fill="#B8C8DC">Thoughtful interfaces. Reliable systems. Software built to last.</text>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="750" letter-spacing="2.1" fill="#A5F3FC">
    <text x="64" y="270">DESIGN</text>
    <text x="132" y="270" fill="#64748B">/</text>
    <text x="151" y="270">ENGINEER</text>
    <text x="238" y="270" fill="#64748B">/</text>
    <text x="257" y="270">IMPROVE</text>
  </g>
  <path d="M742 83V246" stroke="url(#accent)" stroke-width="1.4" stroke-opacity=".75"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16.5">
    <text x="775" y="112" fill="#67E8F9">const</text>
    <text x="829" y="112" fill="#F8FAFC">developer = {</text>
    <text x="800" y="145" fill="#C4B5FD">build:</text>
    <text x="860" y="145" fill="#FDE68A">"thoughtfully",</text>
    <text x="800" y="176" fill="#C4B5FD">test:</text>
    <text x="849" y="176" fill="#FDE68A">"reliably",</text>
    <text x="800" y="207" fill="#C4B5FD">improve:</text>
    <text x="875" y="207" fill="#FDE68A">"continuously"</text>
    <text x="775" y="240" fill="#F8FAFC">};</text>
  </g>
  <path d="M775 258H906" stroke="url(#accent)" stroke-width="1.5" stroke-opacity=".7"/>
</svg>