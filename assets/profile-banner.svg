<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Omnish — Full-Stack JavaScript Developer</title>
  <desc id="desc">A premium navy developer banner with cyan and violet geometry, a restrained code panel, and a clear typographic hierarchy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1020"/>
      <stop offset="52%" stop-color="#0D2340"/>
      <stop offset="100%" stop-color="#0B4556"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="330" rx="24" fill="url(#glow)"/>
  <circle cx="1000" cy="110" r="92" fill="#22D3EE" opacity="0.12" filter="url(#blur)"/>
  <circle cx="1085" cy="250" r="95" fill="#8B5CF6" opacity="0.12" filter="url(#blur)"/>

  <path d="M795 0H935L1200 225V282L1024 330H890L1118 167Z" fill="#050B17" opacity="0.24"/>
  <path d="M855 0H925L1195 224L1154 264Z" fill="url(#accent)" opacity="0.20"/>
  <path d="M1200 34V88L969 307L927 273Z" fill="#67E8F9" opacity="0.13"/>
  <path d="M0 274L174 330H0Z" fill="#0EA5E9" opacity="0.12"/>

  <g stroke="#67E8F9" stroke-width="1.4" stroke-opacity="0.52" fill="none">
    <path d="M770 77H828V54H873"/>
    <path d="M812 126H856V148H897"/>
    <path d="M1000 72H1062V96H1111"/>
    <path d="M1012 244H1073V218H1132"/>
  </g>
  <g fill="#67E8F9">
    <circle cx="873" cy="54" r="3.5"/>
    <circle cx="897" cy="148" r="3.5"/>
    <circle cx="1111" cy="96" r="3.5"/>
    <circle cx="1132" cy="218" r="3.5"/>
  </g>

  <text x="64" y="116" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="66" font-weight="800" letter-spacing="1.5" fill="#F8FAFC">OMNISH</text>
  <rect x="66" y="137" width="78" height="4.5" rx="2.25" fill="url(#accent)"/>
  <text x="64" y="177" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="650" fill="#E2E8F0">React · Node.js · Express · MongoDB</text>
  <text x="64" y="210" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15.5" fill="#B8C8DC">Building useful software with clarity, care, and engineering discipline.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="750" letter-spacing="2" fill="#BAE6FD">
    <text x="65" y="269">BUILD</text>
    <text x="116" y="269" fill="#64748B">/</text>
    <text x="135" y="269">TEST</text>
    <text x="184" y="269" fill="#64748B">/</text>
    <text x="203" y="269">IMPROVE</text>
  </g>

  <rect x="746" y="87" width="382" height="166" rx="17" fill="#071326" fill-opacity="0.82" stroke="#7DD3FC" stroke-opacity="0.34"/>
  <path d="M747 104Q747 88 763 88H1111Q1127 88 1127 104" fill="none" stroke="#67E8F9" stroke-opacity="0.55"/>
  <circle cx="770" cy="105" r="4" fill="#67E8F9"/>
  <circle cx="785" cy="105" r="4" fill="#A78BFA" opacity="0.9"/>
  <circle cx="800" cy="105" r="4" fill="#94A3B8" opacity="0.7"/>
  <path d="M763 119H1110" stroke="#94A3B8" stroke-opacity="0.16"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="770" y="145" fill="#67E8F9">const</text>
    <text x="823" y="145" fill="#E2E8F0">developer = {</text>
    <text x="789" y="174" fill="#C4B5FD">build:</text>
    <text x="849" y="174" fill="#FDE68A">"thoughtfully",</text>
    <text x="789" y="201" fill="#C4B5FD">ship:</text>
    <text x="839" y="201" fill="#FDE68A">"reliably"</text>
    <text x="770" y="229" fill="#E2E8F0">};</text>
  </g>
  <path d="M746 278H870" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.8"/>
</svg>